<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ZenMovie</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">

    <!-- iOS specifics -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZenMovie">
    <link rel="apple-touch-icon" href="icon-192.svg">

    <!-- Libs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://hammerjs.github.io/dist/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 min-h-screen flex flex-col items-center">

    <!-- Header sticky avec safe-area -->
    <header id="app-header" class="sticky-header w-full z-30">
        <nav class="w-full max-w-md mx-auto flex items-center justify-between px-4 py-3">
            <div>
                <h1 class="text-xl font-bold text-white">ZenMovie</h1>
                <p class="text-gray-500 text-xs"><span id="remaining-count">0</span> films restants</p>
            </div>
            <button id="btn-toggle-matches" class="relative flex items-center gap-1.5 px-3 py-1.5 bg-pink-600 hover:bg-pink-500 text-white rounded-full text-xs font-medium transition-colors">
                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                Mes Matchs
                <span id="match-badge" class="absolute -top-1 -right-1 bg-white text-pink-600 text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
            </button>
        </nav>

        <!-- Filtres genre -->
        <div id="genre-filters" class="w-full max-w-md mx-auto overflow-x-auto scrollbar-hide px-4 pb-3">
            <div class="flex gap-2 min-w-max">
                <button class="genre-btn active" data-genre="Tous">Tous</button>
                <button class="genre-btn" data-genre="Action">Action</button>
                <button class="genre-btn" data-genre="Comédie">Comédie</button>
                <button class="genre-btn" data-genre="Drame">Drame</button>
                <button class="genre-btn" data-genre="Horreur">Horreur</button>
                <button class="genre-btn" data-genre="Science-Fiction">Sci-Fi</button>
                <button class="genre-btn" data-genre="Thriller">Thriller</button>
                <button class="genre-btn" data-genre="Animation">Animation</button>
                <button class="genre-btn" data-genre="Romance">Romance</button>
                <button class="genre-btn" data-genre="Crime">Crime</button>
                <button class="genre-btn" data-genre="Fantaisie">Fantaisie</button>
                <button class="genre-btn" data-genre="Guerre">Guerre</button>
                <button class="genre-btn" data-genre="Aventure">Aventure</button>
                <button class="genre-btn" data-genre="Western">Western</button>
            </div>
        </div>
    </header>

    <!-- Vue Swipe -->
    <main id="view-swipe" class="flex flex-col items-center pt-4 px-4">
        <div id="card-container" class="relative w-80 h-[480px]">
            <div id="movie-card" class="absolute inset-0 bg-gray-800 rounded-2xl shadow-2xl overflow-hidden cursor-grab active:cursor-grabbing transition-transform select-none">
                <img id="movie-poster" src="" alt="Affiche du film" class="w-full h-72 object-cover">
                <div class="p-4">
                    <h2 id="movie-title" class="text-xl font-bold text-white"></h2>
                    <p id="movie-year" class="text-gray-400 mt-1"></p>
                    <button id="btn-details" class="mt-3 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm transition-colors">
                        Détails
                    </button>
                </div>
                <div id="swipe-indicator" class="absolute top-6 left-1/2 -translate-x-1/2 text-4xl font-bold opacity-0 transition-opacity pointer-events-none"></div>
            </div>
        </div>

        <div class="flex gap-6 mt-8">
            <button id="btn-dislike" class="w-14 h-14 rounded-full bg-red-500/20 border-2 border-red-500 text-red-500 text-2xl flex items-center justify-center hover:bg-red-500 hover:text-white transition-colors">
                &#10060;
            </button>
            <button id="btn-like" class="w-14 h-14 rounded-full bg-green-500/20 border-2 border-green-500 text-green-500 text-2xl flex items-center justify-center hover:bg-green-500 hover:text-white transition-colors">
                &#10084;&#65039;
            </button>
        </div>
    </main>

    <!-- Vue Matchs -->
    <section id="view-matches" class="hidden w-full max-w-md pt-4 px-4">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold text-white">Mes Matchs</h2>
            <button id="btn-back-swipe" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-full text-sm transition-colors">
                Retour au swipe
            </button>
        </div>
        <p id="matches-empty" class="text-gray-500 text-center py-12 hidden">Aucun match pour l'instant. Swipe des films vers la droite !</p>
        <ul id="matches-list" class="space-y-3 overflow-y-auto max-h-[70vh] pb-4"></ul>
    </section>

    <!-- Overlay Détails (swipe) -->
    <div id="details-overlay" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-800 rounded-2xl p-6 max-w-sm w-full max-h-[85vh] overflow-y-auto">
            <h3 id="details-title" class="text-xl font-bold text-white mb-2"></h3>
            <p id="details-summary" class="text-gray-300 text-sm leading-relaxed"></p>
            <button id="btn-close-details" class="mt-4 px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg text-sm transition-colors">
                Fermer
            </button>
        </div>
    </div>

    <!-- Overlay Détails Match -->
    <div id="match-details-overlay" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-800 rounded-2xl max-w-sm w-full max-h-[85vh] overflow-y-auto">
            <div class="relative">
                <img id="match-detail-poster" src="" alt="" class="w-full h-56 object-cover rounded-t-2xl">
                <button id="btn-close-match-details" class="absolute top-3 right-3 w-8 h-8 bg-black/60 rounded-full flex items-center justify-center text-white hover:bg-black/80 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-5">
                <h3 id="match-detail-title" class="text-xl font-bold text-white"></h3>
                <p id="match-detail-meta" class="text-gray-400 text-sm mt-1"></p>
                <p id="match-detail-description" class="text-gray-300 text-sm leading-relaxed mt-3"></p>
                <div id="match-detail-providers" class="mt-4">
                    <p class="text-gray-400 text-xs font-medium uppercase tracking-wide mb-2">Disponible sur</p>
                    <div id="providers-list" class="flex flex-wrap gap-2"></div>
                    <p id="providers-empty" class="text-gray-500 text-xs hidden">Aucune plateforme trouvée pour ton pays.</p>
                    <p id="providers-loading" class="text-gray-500 text-xs">Chargement...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Animation coeur (swipe normal) -->
    <div id="heart-animation" class="fixed inset-0 flex items-center justify-center pointer-events-none z-40">
        <span class="heart-pulse hidden text-7xl">&#10084;&#65039;</span>
    </div>

    <!-- Overlay MATCH ! (coup de coeur) -->
    <div id="match-overlay" class="hidden fixed inset-0 z-[100] flex flex-col items-center justify-center">
        <div class="match-backdrop absolute inset-0 bg-black/70 backdrop-blur-md"></div>
        <div class="match-content relative flex flex-col items-center gap-4 px-6 text-center">
            <div class="match-stars">
                <span class="text-5xl">&#11088;</span>
            </div>
            <h2 class="match-title text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500">MATCH !</h2>
            <p class="match-subtitle text-white text-lg font-medium opacity-0">Coup de coeur</p>
            <div class="match-movie-info mt-2 opacity-0">
                <img id="match-overlay-poster" src="" alt="" class="w-32 h-48 object-cover rounded-xl shadow-2xl mx-auto ring-4 ring-purple-500/50">
                <p id="match-overlay-title" class="text-white font-bold mt-3 text-lg"></p>
                <p id="match-overlay-rating" class="text-yellow-400 text-sm mt-1"></p>
            </div>
            <button id="btn-continue-swipe" class="match-btn mt-6 px-8 py-3 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-bold rounded-full text-base shadow-lg shadow-purple-500/30 transition-all opacity-0">
                Continuer à swiper
            </button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js").then(() => {
                console.log("Service Worker enregistré");
            }).catch((err) => {
                console.warn("Service Worker non enregistré:", err);
            });
        }
    </script>
</body>
</html>
